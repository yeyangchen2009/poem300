name: Crawl cnkgraph (剩余数据)

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: 'Concurrency (default 3)'
        required: false
        default: '3'

jobs:
  crawl-remaining:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: cnkgraph
        run: pip install -r requirements.txt

      - name: Create data directory
        run: mkdir -p cnkgraph/data

      - name: Run tang300 (Stage 1-5, 唐诗三百首诗人)
        working-directory: cnkgraph
        run: python -u src/crawl-tang300.py --concurrency ${{ inputs.concurrency }}

      - name: Run Supplement char
        working-directory: cnkgraph
        run: python -u src/crawl-supplement.py --module char --concurrency ${{ inputs.concurrency }}

      - name: Show final status
        working-directory: cnkgraph
        run: python -u src/crawl.py --status

      - name: Upload DuckDB
        uses: actions/upload-artifact@v4
        with:
          name: cnkgraph-unified
          path: cnkgraph/data/cnkgraph.duckdb
          retention-days: 30
