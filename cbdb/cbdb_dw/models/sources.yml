version: 2

sources:
  - name: cbdb_src
    description: "CBDB 中国历代人物传记资料库（SQLite 源库，77 张实表）"
    database: cbdb_src
    schema: main
    tables:

      - name: ADDR_BELONGS_DATA
        description: 存储地址归属关系的时序数据，记录特定地址在时间维度上所属的上级行政区划及其来源信息
        meta:
          row_count: 2
        columns:
          - name: c_addr_id
            description: 当前地址的唯一标识符，关联地址编码表(ADDR_CODES/ADDRESSES)的主键
          - name: c_belongs_to
            description: 上级归属地址的唯一标识符，递归关联本表或地址编码表(ADDR_CODES/ADDRESSES)的c_addr_id
          - name: c_firstyear
            description: 归属关系生效起始年份（公元纪年）
          - name: c_lastyear
            description: 归属关系生效结束年份（公元纪年）
          - name: c_source
            description: 资料来源标识符，关联文本资料表(TEXT_CODES)的c_textid字段
          - name: c_pages
            description: 资料来源的具体页码或位置说明
          - name: c_notes
            description: 关于该归属关系的补充说明或考证注释
          - name: c_created_by
            description: 记录创建人
          - name: c_created_date
            description: 记录创建时间
          - name: c_modified_by
            description: 记录修改人
          - name: c_modified_date
            description: 记录修改时间

      - name: ADDR_CODES
        description: 存储地址编码信息，包括地址的中英文名称、存在的时间范围、地理坐标及行政区类型等。
        meta:
          row_count: 589
        columns:
          - name: c_addr_id
            description: 地址的唯一标识符
          - name: c_name
            description: 地址的英文名称
          - name: c_name_chn
            description: 地址的中文名称
          - name: c_firstyear
            description: 地址存在的起始年份
          - name: c_lastyear
            description: 地址存在的结束年份
          - name: c_admin_type
            description: 行政区类型（如省、州、县等）
          - name: c_admin_cat_code
            description: 行政区类别编码
          - name: x_coord
            description: 地理经度坐标
          - name: y_coord
            description: 地理纬度坐标
          - name: CHGIS_PT_ID
            description: 中国历史地理信息系统（CHGIS）中的点标识符
          - name: c_notes
            description: 备注或附加信息
          - name: c_alt_names
            description: 地址的备用名称或别名

      - name: ADMIN_CAT_CODES
        description: 行政区类别代码表，定义行政区划的类型编码
        meta:
          row_count: 1175
        columns:
          - name: c_admin_cat_code
            description: 行政区类别编码
          - name: c_admin_cat_py
            description: 行政区类别拼音名
          - name: c_admin_cat_hz
            description: 行政区类别中文名
          - name: c_admin_cat_trans
            description: 行政区类别英文名
          - name: c_notes
            description: 备注说明

      - name: ADMIN_CAT_CODE_TYPE_REL
        description: 行政区类别与类型的关联关系表
        meta:
          row_count: 1180
        columns:
          - name: c_admin_cat_code
            description: 行政区类别编码
          - name: c_admin_cat_type_code
            description: 行政区类型编码

      - name: ADMIN_CAT_TYPES
        description: 行政区类型代码表，定义行政区划类型分类
        meta:
          row_count: 1182
        columns:
          - name: c_admin_cat_type_code
            description: 行政区类型编码
          - name: c_admin_cat_type_hz
            description: 行政区类型中文名
          - name: c_admin_cat_type_trans
            description: 行政区类型英文名
          - name: c_notes
            description: 备注说明

      - name: ALTNAME_CODES
        description: 存储别名类型代码及其描述的表，包括中文和英文版本
        meta:
          row_count: 1184
        columns:
          - name: c_name_type_code
            description: 别名类型的唯一标识代码
          - name: c_name_type_desc
            description: 别名类型的英文描述
          - name: c_name_type_desc_chn
            description: 别名类型的中文描述

      - name: ALTNAME_DATA
        description: 存储人物别名信息数据表，记录历史人物的各种别名、字号、谥号等替代名称信息
        meta:
          row_count: 1186
        columns:
          - name: c_personid
            description: 关联人物主键，对应BIOG_MAIN表的c_personid
          - name: c_alt_name
            description: 人物非中文别名/字号（如罗马化名称）
          - name: c_alt_name_chn
            description: 人物中文别名/字号（汉字形式）
          - name: c_alt_name_type_code
            description: 别名类型代码，关联ALTNAME_CODES表的c_name_type_code
          - name: c_sequence
            description: 别名显示顺序编号
          - name: c_source
            description: 资料来源标识，关联TEXT_CODES表的c_textid
          - name: c_pages
            description: 资料来源页码或卷号
          - name: c_notes
            description: 别名备注说明
          - name: c_created_by
            description: 记录创建者
          - name: c_modified_by
            description: 记录最后修改者
          - name: c_created_date
            description: 记录创建时间
          - name: c_modified_date
            description: 记录最后修改时间

      - name: APPOINTMENT_CODES
        description: 任命方式代码表，定义官员任命的具体方式
        meta:
          row_count: 6272
        columns:
          - name: c_appt_code
            description: 任命方式编码
          - name: c_appt_desc_chn
            description: 任命方式中文描述
          - name: c_appt_desc
            description: 任命方式英文描述
          - name: c_appt_desc_chn_alt
            description: 任命方式中文别名
          - name: c_appt_desc_alt
            description: 任命方式英文别名
          - name: c_notes
            description: 备注说明

      - name: APPOINTMENT_CODE_TYPE_REL
        description: 任命方式与类型的关联关系表
        meta:
          row_count: 6276
        columns:
          - name: c_appt_type_code
            description: 任命类型编码
          - name: c_appt_code
            description: 任命方式编码

      - name: APPOINTMENT_TYPES
        description: 任命类型代码表，定义任命方式的分类
        meta:
          row_count: 6280
        columns:
          - name: c_appt_type_code
            description: 任命类型编码
          - name: c_appt_type_desc
            description: 任命类型英文描述
          - name: c_appt_type_desc_chn
            description: 任命类型中文描述

      - name: ASSOC_CODES
        description: 存储人物关联关系的类型代码及其描述信息，用于定义不同人物间的关联类型和角色关系。
        meta:
          row_count: 6282
        columns:
          - name: c_assoc_code
            description: 关联类型的唯一标识符代码，用于唯一标识一种关联关系类型。
          - name: c_assoc_pair
            description: 关联关系中的第一个角色类型代码，可能与其他代码表关联。
          - name: c_assoc_pair2
            description: 关联关系中的第二个角色类型代码，可能与其他代码表关联。
          - name: c_assoc_desc
            description: 关联关系的英文描述，说明该代码对应的具体关联类型。
          - name: c_assoc_desc_chn
            description: 关联关系的中文描述，说明该代码对应的具体关联类型。
          - name: c_assoc_role_type
            description: "关联角色类型的分类代码，例如主动或被动角色（如 'A' 表示主动）。"
          - name: c_sortorder
            description: 排序序号，用于控制该关联类型在列表中的显示顺序。
          - name: c_example
            description: 关联类型的示例说明，提供具体应用场景的示例文本。

      - name: ASSOC_CODE_TYPE_REL
        description: 存储关联关系代码与关联类型之间的映射关系，用于定义不同类型的社交关联对应的分类标识
        meta:
          row_count: 6295
        columns:
          - name: c_assoc_code
            description: 关联关系代码，指向ASSOC_CODES表的c_assoc_code字段，标识具体的社交关系类型
          - name: c_assoc_type_code
            description: 关联类型标识符，指向ASSOC_TYPES表，定义社交关系的分类层级

      - name: ASSOC_DATA
        description: 存储人物社会关系数据的核心表，记录人物之间的亲属关系、社交关联及关联事件的具体信息
        meta:
          row_count: 6301
        columns:
          - name: c_assoc_code
            description: 关联类型代码，关联ASSOC_CODES表定义关系类型
          - name: c_personid
            description: 主人物ID，关联BIOG_MAIN表
          - name: c_kin_code
            description: 亲属关系代码，关联KINSHIP_CODES表
          - name: c_kin_id
            description: 亲属关系实例ID，用于区分同一类型的不同亲属关系
          - name: c_assoc_id
            description: 关联实例唯一标识符
          - name: c_assoc_kin_code
            description: 关联对象的亲属关系代码，关联KINSHIP_CODES表
          - name: c_assoc_kin_id
            description: 关联对象的亲属关系实例ID
          - name: c_tertiary_personid
            description: 第三方参与人物ID，关联BIOG_MAIN表
          - name: c_tertiary_type_notes
            description: 第三方参与类型的文字说明
          - name: c_assoc_count
            description: 关联事件发生次数
          - name: c_sequence
            description: 同一关联事件的顺序编号
          - name: c_assoc_first_year
            description: 社交关系起始年份
          - name: c_assoc_last_year
            description: 社交关系结束年份
          - name: c_source
            description: 资料来源代码，关联TEXT_CODES表
          - name: c_pages
            description: 资料来源页码或卷册信息
          - name: c_notes
            description: 关联事件备注说明
          - name: c_assoc_fy_nh_code
            description: 起始年年号编码
          - name: c_assoc_fy_nh_year
            description: 起始年年号年份
          - name: c_assoc_fy_range
            description: 起始年年份范围标识
          - name: c_assoc_ly_nh_code
            description: 结束年年号编码
          - name: c_assoc_ly_nh_year
            description: 结束年年号年份
          - name: c_assoc_ly_range
            description: 结束年年份范围标识
          - name: c_addr_id
            description: 关联发生地点ID，关联ADDRESSES表
          - name: c_litgenre_code
            description: 文学体裁代码，关联LITERARYGENRE_CODES表
          - name: c_occasion_code
            description: 社交场合代码，关联OCCASION_CODES表
          - name: c_topic_code
            description: 学术主题代码，关联SCHOLARLYTOPIC_CODES表
          - name: c_inst_code
            description: 机构类型代码，关联SOCIAL_INSTITUTION_TYPES表
          - name: c_inst_name_code
            description: 机构名称代码，关联SOCIAL_INSTITUTION_NAME_CODES表
          - name: c_text_title
            description: 关联文献标题（强制存储原始汉字）
          - name: c_assoc_claimer_id
            description: 关联主张者ID，关联BIOG_MAIN表
          - name: c_assoc_fy_intercalary
            description: 起始年闰月标识
          - name: c_assoc_fy_month
            description: 起始年月份
          - name: c_assoc_fy_day
            description: 起始年日期
          - name: c_assoc_fy_day_gz
            description: 起始年日干支编码
          - name: c_assoc_ly_intercalary
            description: 结束年闰月标识
          - name: c_assoc_ly_month
            description: 结束年月份
          - name: c_assoc_ly_day
            description: 结束年日期
          - name: c_assoc_ly_day_gz
            description: 结束年日干支编码
          - name: c_created_by
            description: 记录创建者
          - name: c_modified_by
            description: 最后修改者
          - name: c_created_date
            description: 记录创建日期
          - name: c_modified_date
            description: 最后修改日期

      - name: ASSOC_TYPES
        description: 存储关联类型的主分类表，定义社会关系类型的层级结构和展示顺序
        meta:
          row_count: 15204
        columns:
          - name: c_assoc_type_code
            description: 关联类型唯一标识符，用于区分不同类型的社会关系分类
          - name: c_assoc_type_desc
            description: 关联类型的英文描述，说明该分类的具体含义
          - name: c_assoc_type_desc_chn
            description: 关联类型的中文描述，说明该分类的具体含义
          - name: c_assoc_type_parent_id
            description: 父级关联类型ID，用于构建多层级分类结构
          - name: c_assoc_type_level
            description: 分类层级编号，表示该类型在树形结构中的位置（如1级为根分类）
          - name: c_assoc_type_sortorder
            description: 分类排序序号，控制同层级分类的显示顺序
          - name: c_assoc_type_short_desc
            description: 关联类型简短描述，用于界面显示等需要简洁说明的场景

      - name: ASSUME_OFFICE_CODES
        description: 存储官员任职方式类型的编码表，用于标识官员获得职位的方式（如任命、选举、继承等）
        meta:
          row_count: 15207
        columns:
          - name: c_assume_office_code
            description: 担任职务方式的唯一标识代码
          - name: c_assume_office_desc_chn
            description: "任职方式的中文描述（如'任命'、'世袭'等）"
          - name: c_assume_office_desc
            description: "任职方式的英文描述（如'Appointment'、'Hereditary'等）"

      - name: BIOG_ADDR_CODES
        description: 存储人物地址类型代码及其描述信息，用于定义不同地址类型的分类标准和索引排序规则
        meta:
          row_count: 15209
        columns:
          - name: c_addr_type
            description: 地址类型唯一编码（主标识符）
          - name: c_addr_desc
            description: 地址类型英文描述（如籍贯/居住地/墓葬地等）
          - name: c_addr_desc_chn
            description: 地址类型中文描述（如：籍贯/居住地/墓葬地等）
          - name: c_addr_note
            description: 地址类型补充说明
          - name: c_index_addr_rank
            description: 地址类型在索引中的排序权重值
          - name: c_index_addr_default_rank
            description: 地址类型默认索引排序等级

      - name: BIOG_ADDR_DATA
        description: 存储人物生平地址关联数据，记录人物在不同时间段内的地址信息及其类型、来源和日期细节
        meta:
          row_count: 15211
        columns:
          - name: c_personid
            description: 关联BIOG_MAIN表的人物唯一标识符
          - name: c_addr_id
            description: 关联ADDRESSES表的地址唯一标识符
          - name: c_addr_type
            description: 地址类型代码，关联BIOG_ADDR_CODES表的c_addr_type字段
          - name: c_sequence
            description: 地址信息在人物生平中的排序序列号
          - name: c_firstyear
            description: 地址关联起始年份（公历年）
          - name: c_lastyear
            description: 地址关联结束年份（公历年）
          - name: c_source
            description: 资料来源代码，关联TEXT_CODES表的c_textid字段
          - name: c_pages
            description: 资料来源页码或卷册信息
          - name: c_notes
            description: 地址关联备注信息
          - name: c_fy_nh_code
            description: 起始年份对应的年号代码，关联NIAN_HAO表的c_nianhao_id
          - name: c_ly_nh_code
            description: 结束年份对应的年号代码，关联NIAN_HAO表的c_nianhao_id
          - name: c_fy_nh_year
            description: 起始年份对应的年号纪年
          - name: c_ly_nh_year
            description: 结束年份对应的年号纪年
          - name: c_fy_range
            description: 起始年份范围代码，关联YEAR_RANGE_CODES表的c_range_code
          - name: c_ly_range
            description: 结束年份范围代码，关联YEAR_RANGE_CODES表的c_range_code
          - name: c_natal
            description: 标识是否为籍贯地址（1=是，0=否）
          - name: c_fy_intercalary
            description: 起始年份是否包含闰月（1=是，0=否）
          - name: c_ly_intercalary
            description: 结束年份是否包含闰月（1=是，0=否）
          - name: c_fy_month
            description: 起始月份（农历）
          - name: c_ly_month
            description: 结束月份（农历）
          - name: c_fy_day
            description: 起始日期（农历）
          - name: c_ly_day
            description: 结束日期（农历）
          - name: c_fy_day_gz
            description: 起始日期的干支代码，关联GANZHI_CODES表的c_ganzhi_code
          - name: c_ly_day_gz
            description: 结束日期的干支代码，关联GANZHI_CODES表的c_ganzhi_code
          - name: c_created_by
            description: 记录创建者
          - name: c_modified_by
            description: 记录最后修改者
          - name: c_delete
            description: 软删除标记（1=已删除，0=未删除）
          - name: c_created_date
            description: 记录创建日期
          - name: c_modified_date
            description: 记录最后修改日期

      - name: BIOG_INST_CODES
        description: 存储人物与机构关联角色代码的字典表，定义不同机构角色类型及其描述信息
        meta:
          row_count: 28058
        columns:
          - name: c_bi_role_code
            description: 机构角色代码，唯一标识人物在机构中担任的角色类型
          - name: c_bi_role_desc
            description: 角色类型英文描述，说明机构角色的具体含义
          - name: c_bi_role_chn
            description: 角色类型中文描述，说明机构角色的具体含义
          - name: c_notes
            description: 附加注释，记录特殊说明或数据来源信息

      - name: BIOG_INST_DATA
        description: 记录人物与社会机构关系的任职经历数据表
        meta:
          row_count: 28060
        columns:
          - name: c_personid
            description: 人物唯一标识符，关联 BIOG_MAIN 表
          - name: c_inst_name_code
            description: 机构名称代码，关联 SOCIAL_INSTITUTION_NAME_CODES 表
          - name: c_inst_code
            description: 机构类型代码，关联 SOCIAL_INSTITUTION_CODES 表
          - name: c_bi_role_code
            description: 人物在机构中的角色代码，关联 BIOG_INST_CODES 表
          - name: c_bi_begin_year
            description: 任职开始年份（绝对年份）
          - name: c_bi_by_nh_code
            description: 任职开始年号代码，关联 NIAN_HAO 表
          - name: c_bi_by_nh_year
            description: 任职开始年号的年份
          - name: c_bi_by_range
            description: 任职开始年份范围代码，关联 YEAR_RANGE_CODES 表
          - name: c_bi_end_year
            description: 任职结束年份（绝对年份）
          - name: c_bi_ey_nh_code
            description: 任职结束年号代码，关联 NIAN_HAO 表
          - name: c_bi_ey_nh_year
            description: 任职结束年号的年份
          - name: c_bi_ey_range
            description: 任职结束年份范围代码，关联 YEAR_RANGE_CODES 表
          - name: c_source
            description: 资料来源标识符，关联 TEXT_CODES 表
          - name: c_pages
            description: 资料来源页码或卷号
          - name: c_notes
            description: 备注或补充说明
          - name: c_created_by
            description: 记录创建者
          - name: c_modified_by
            description: 记录最后修改者
          - name: c_created_date
            description: 记录创建日期
          - name: c_modified_date
            description: 记录最后修改日期

      - name: BIOG_MAIN
        description: 存储人物核心传记信息的主表，包含人物的基本属性、生卒年份、籍贯信息、民族归属、行政编码及系统元数据等核心字段
        meta:
          row_count: 28079
        columns:
          - name: c_personid
            description: 人物唯一标识符，系统主键
          - name: c_name
            description: 人物姓名（拉丁化形式）
          - name: c_name_chn
