    +persist_docs:
      relation: true
      columns: true
    ods:
      +materialized: table
      +schema: ods
    dim:
      +materialized: table
      +schema: dim
    dwd:
      +materialized: table
      +schema: dwd
    dws:
      +materialized: table
      +schema: dws
    ads:
      +materialized: table
      +schema: ads
